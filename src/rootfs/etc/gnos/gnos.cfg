# GNOS 系统配置文件 — 由 gnoscfg 管理
# 此文件由配置工具自动生成，也可手动编辑。

[控制台]
GNOS_CONSOLE=y
GNOS_CONSOLE_TITLE=启用控制台
GNOS_CONSOLE_HELP=在 VGA 文本模式下启动控制台（/dev/tty0）

[图形]
GNOS_FRAMEBUFFER=y
GNOS_FRAMEBUFFER_TITLE=启用帧缓冲
GNOS_FRAMEBUFFER_HELP=初始化 VESA/VBE 帧缓冲设备
GNOS_DRM=y
GNOS_DRM_TITLE=启用 DRM 图形
GNOS_DRM_HELP=加载 Intel GEM 驱动以提供 2D/3D 渲染

[输入]
GNOS_INPUT=y
GNOS_INPUT_TITLE=启用输入设备
GNOS_INPUT_HELP=支持 PS/2 键盘和鼠标事件
GNOS_USB=y
GNOS_USB_TITLE=启用 USB
GNOS_USB_HELP=加载 xHCI USB 主控制器驱动

[音频/网络]
GNOS_AUDIO=n
GNOS_AUDIO_TITLE=启用音频
GNOS_AUDIO_HELP=加载 Intel HDA/AC97 音频驱动
GNOS_NETWORK=y
GNOS_NETWORK_TITLE=启用网络
GNOS_NETWORK_HELP=加载 Intel e1000 网卡驱动并初始化 TCP/IP 协议栈

[服务]
GNOS_OPENRC=y
GNOS_OPENRC_TITLE=启动 OpenRC
GNOS_OPENRC_HELP=在 initrd 中运行 OpenRC 服务管理器
GNOS_UDEV=y
GNOS_UDEV_TITLE=启动 udev
GNOS_UDEV_HELP=运行 udevd 守护进程并创建设备节点
GNOS_DBUS=n
GNOS_DBUS_TITLE=启动 D-Bus
GNOS_DBUS_HELP=运行 D-Bus 系统总线守护进程

[安全]
GNOS_SECCOMP=y
GNOS_SECCOMP_TITLE=启用 seccomp-BPF
GNOS_SECCOMP_HELP=允许用户空间安装系统调用过滤器
GNOS_CGROUP=y
GNOS_CGROUP_TITLE=启用 cgroup v2
GNOS_CGROUP_HELP=支持进程组资源限制和统计

[系统]
GNOS_SHELL=/bin/sh
GNOS_SHELL_TITLE=默认 Shell
GNOS_SHELL_HELP=登录时启动的默认命令行解释器
