# GNOS: drive the software KMS device through the modesetting driver.
# The device publishes /dev/dri/card0 with dumb buffers and an atomic
# interface; there is no PCI bus to probe and no udev, so the input
# devices are bound statically to the evdev driver below.

Section "ServerFlags"
    Option "AutoAddDevices"   "false"
    Option "AllowMouseOpenFail" "true"
EndSection

Section "InputDevice"
    Identifier  "gnos-kbd"
    Driver      "evdev"
    Option      "Device" "/dev/input/event0"
    Option      "XkbRules" "evdev"
    Option      "XkbModel" "pc105"
    Option      "XkbLayout" "us"
EndSection

Section "InputDevice"
    Identifier  "gnos-mouse"
    Driver      "evdev"
    Option      "Device" "/dev/input/event1"
    Option      "Protocol" "auto"
EndSection

Section "Device"
    Identifier  "gnos-drm"
    Driver      "modesetting"
    Option      "kmsdev" "/dev/dri/card0"
    Option      "AccelMethod" "none"
EndSection

Section "Monitor"
    Identifier  "gnos-monitor"
    HorizSync   30-70
    VertRefresh 50-70
EndSection

Section "Screen"
    Identifier   "gnos-screen"
    Device       "gnos-drm"
    Monitor      "gnos-monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1280x800" "1280x720"
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier  "gnos-layout"
    Screen      0 "gnos-screen" 0 0
    InputDevice "gnos-mouse" "CorePointer"
    InputDevice "gnos-kbd"   "CoreKeyboard"
EndSection
