name: ci

# Every push to main and every pull request goes through the same gate:
# style first, then headers, then a real kernel build, and -- when the
# ISO is reachable -- a 20-second boot self-test under QEMU.
on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read
  pull-requests: write      # the pr-bot job edits an issue comment

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      summary: ${{ steps.gate.outputs.summary }}
      outcome: ${{ steps.gate.outputs.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-13 make nasm python3 qemu-system-x86 xorriso \
            e2fsprogs clang-format-18 curl ca-certificates
          sudo ln -sf clang-format-18 /usr/local/bin/clang-format || true

      - name: clang-format gate
        run: make check-format

      - name: header-name uniqueness
        run: make check-hdrs

      - name: kernel build (GNOSKr.elf)
        run: make build/GNOSKr.elf CC=gcc-13

      - name: boot self-test (qemu headless)
        id: boottest
        run: |
          make build/gnos.iso CC=gcc-13
          set +e
          timeout 120 make test CC=gcc-13 > build/test.log 2>&1
          rc=$?
          set -e
          {
            echo '```text'
            tail -40 build/test.log || true
            echo '```'
          } > build/test.tail
          if [ $rc -eq 0 ] || grep -qiE 'PASS' build/dbg.log; then
            echo "boot test: usable boot reached (rc=$rc)"
            echo "outcome=pass" >> $GITHUB_OUTPUT
          else
            echo "boot test: no PASS markers/dbg.log"
            echo "outcome=fail" >> $GITHUB_OUTPUT
          fi

      - name: summary for pr bot
        id: gate
        run: |
          boot="${{ steps.boottest.outputs.outcome || 'fail' }}"
          {
            echo "summary<<EOF"
            echo "- clang-format: ok"
            echo "- check-hdrs: ok"
            echo "- kernel build: ok"
            echo "- boot test: $boot"
            echo "EOF"
            echo "outcome=$boot"
          } >> $GITHUB_OUTPUT

  pr-bot:
    needs: check
    runs-on: ubuntu-latest
    # Only makes sense on pull requests; silently no-ops on pushes.
    if: github.event_name == 'pull_request'
    steps:
      - name: PR Bot — report the check result in place
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '### GNOS CI gate';
            const body = `${marker}\n\n${process.env.SUMMARY}\n\n*This comment is kept up to date on every push by .github/workflows/ci.yml.*`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const prev = comments.data.find(c => c.body && c.body.includes(marker));
            if (prev) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: prev.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
        env:
          SUMMARY: ${{ needs.check.outputs.summary }}
