name: ci

# Every push to main and every pull request goes through the same gate:
# style first, then headers, then a real kernel build, and -- once the ISO
# is built -- a boot self-test under QEMU.  clang-format comes from pip at
# the exact 18.1.7 the tree was formatted with: formatting decisions drift
# between clang-format releases, and a runner-image default is not a pin.
on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read
  pull-requests: write      # the pr-bot job edits an issue comment

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      summary: ${{ steps.gate.outputs.summary }}
      outcome: ${{ steps.gate.outputs.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-13 make nasm python3 qemu-system-x86 qemu-utils xorriso \
            e2fsprogs curl ca-certificates xz-utils bzip2 unzip file
          # Exact-format pin: same clang-format release on both sides.
          python3 -m pip install --user --break-system-packages clang-format==18.1.7
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          "$HOME/.local/bin/clang-format" --version

      - name: clang-format gate
        run: make check-format CLANG_FORMAT="$HOME/.local/bin/clang-format"

      - name: header-name uniqueness
        run: make check-hdrs

      - name: kernel build (GNOSKr.elf)
        run: make build/GNOSKr.elf CC=gcc-13

      - name: boot self-test (qemu headless)
        id: boottest
        # The ISO build compiles the whole musl userland from scratch here,
        # and the 1G ISO needs ~90s over the CD path before dbg.log says
        # anything -- hence the generous step budget (make test itself
        # gives qemu a 400 s window; the ISO is pre-built above, so 600 s
        # covers the window plus the assertions with room to spare).
        timeout-minutes: 90
        run: |
          make build/gnos.iso CC=gcc-13
          set +e
          timeout 600 make test CC=gcc-13 > build/test.log 2>&1
          rc=$?
          set -e
          {
            echo '```text'
            tail -40 build/test.log || true
            echo '```'
          } > build/test.tail
          if [ $rc -eq 0 ]; then
            echo "boot test: all assertions green (rc=$rc)"
            echo "outcome=pass" >> $GITHUB_OUTPUT
          else
            echo "boot test: make test failed (rc=$rc)"
            echo "outcome=fail" >> $GITHUB_OUTPUT
          fi
          # The init NOTICE (pid 1 + inittab + first child) and the
          # OpenRC/agetty NOTICE both ride into the PR summary verbatim --
          # "the real Alpine init started" and "openrc + agetty ran" are the
          # claims users of this repo actually care about.
          init=$(grep -m1 '^NOTICE: real Alpine init' build/test.log || \
                  echo 'NOTICE: real Alpine init NOT seen')
          echo "init=$init" >> $GITHUB_OUTPUT
          oarc=$(grep -m1 '^NOTICE: OpenRC' build/test.log || \
                  echo 'NOTICE: OpenRC + real AGeTTy NOT seen')
          echo "openrc=$oarc" >> $GITHUB_OUTPUT

      - name: summary for pr bot
        id: gate
        run: |
          boot="${{ steps.boottest.outputs.outcome || 'fail' }}"
          init="${{ steps.boottest.outputs.init || 'no boot log' }}"
          openrc="${{ steps.boottest.outputs.openrc || 'no boot log' }}"
          {
            echo "summary<<EOF"
            echo "- clang-format: ok"
            echo "- check-hdrs: ok"
            echo "- kernel build: ok"
            echo "- boot test: $boot"
            echo "- $init"
            echo "- $openrc"
            echo "EOF"
            echo "outcome=$boot"
          } >> $GITHUB_OUTPUT

  pr-bot:
    needs: check
    runs-on: ubuntu-latest
    # Only makes sense on pull requests; silently no-ops on pushes.
    if: github.event_name == 'pull_request'
    steps:
      - name: PR Bot — report the check result in place
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '### GNOS CI gate';
            const body = `${marker}\n\n${process.env.SUMMARY}\n\n*This comment is kept up to date on every push by .github/workflows/ci.yml.*`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const prev = comments.data.find(c => c.body && c.body.includes(marker));
            if (prev) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: prev.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
        env:
          SUMMARY: ${{ needs.check.outputs.summary }}
